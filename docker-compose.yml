services:
  postgres:
    image: postgres:18.2-alpine3.23
    restart: always
    environment:
      # Credentials parameterized via .env so operators can bake stronger
      # ones in on FRESH installs without editing the compose file. The
      # defaults match the historical hardcoded values — existing
      # operators pulling this compose see zero behavioural change because
      # the Postgres image honours POSTGRES_* only on initdb against an
      # empty data dir, and their pg_data volume already has `postgres`
      # role with `postgres` password baked in.
      #
      # Production hardening — set these in `.env` BEFORE the first
      # `docker compose up`:
      #     POSTGRES_PASSWORD=$(openssl rand -base64 24)
      #
      # Changing POSTGRES_USER / POSTGRES_DB on an existing volume won't
      # take effect (Postgres image behaviour); it's a role rename
      # requiring a dump → wipe → restore cycle. See
      # `docs/config/deployment.md § Postgres credentials and ports`.
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-oxicloud}
    # No `ports:` mapping. The `oxicloud` service reaches `postgres` over
    # the internal `oxicloud` bridge network by hostname, which is enough
    # for every production use case; mapping 5432 to the host binds on
    # 0.0.0.0 and makes a weak default password externally reachable.
    # Dev / debugging access (local `psql`, Prometheus postgres_exporter,
    # etc.) belongs in a per-operator `docker-compose.override.yml`
    # binding to 127.0.0.1 explicitly — override files are gitignored by
    # Compose convention. See
    # `docs/config/deployment.md § Postgres credentials and ports`.
    networks:
      - oxicloud
    volumes:
      - pg_data:/var/lib/postgresql/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  oxicloud:
    image: diocrafts/oxicloud:latest
    restart: always
    environment:
      # Return freed heap pages to the OS promptly. mimalloc retains them by
      # default, so idle RSS clamps at the peak even after the in-memory caches
      # expire; purging immediately makes RSS track the live working set
      # (benchmarked: ~400 MB reclaimed on musl/aarch64) at no throughput cost.
      # Also baked into the Dockerfile; set here so it applies to the prebuilt
      # image too.
      MIMALLOC_PURGE_DELAY: "0"
    build:
      context: .
      dockerfile: Dockerfile
      # Route `docker compose up --build` / `docker compose build` through the
      # cache-mount builder so repeat local builds recompile only changed crates
      # (true incremental). Compose v2 uses BuildKit by default, which the
      # Dockerfile already requires. The image is functionally identical to the
      # default `builder` stage CI uses; only the build path differs.
      args:
        BUILDER: builder-cache
        BIN_DIR: /app/bin
    ports:
      - "8086:8086"
    networks:
      - oxicloud
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - storage_data:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8086/ready || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

networks:
  oxicloud:
    driver: bridge

volumes:
  pg_data:
  storage_data:

# ─────────────────────────────────────────────────────────────────────
# oasdiff — allow-list for API breaking changes vs. the PR base branch
# ─────────────────────────────────────────────────────────────────────
# This file is read by `oasdiff breaking --err-ignore` in the
# `openapi-breaking-check` CI job (.github/workflows/ci.yml) and the
# local mirror `just check-openapi`. Each non-blank, non-comment line
# is an EXACT MATCH against one line of oasdiff's `--format singleline`
# output (the leading `error ` prefix is optional; everything after it
# must match verbatim). oasdiff supports no substring or regex form.
#
# WHOLE-RULE DOWNGRADES live in `checks/openapi/severity.conf`, not
# here. That file is a plain `<rule-id> <level>` table — oasdiff does
# not support comments in it, so the rationale for each downgrade is
# recorded in the "Severity downgrades" section at the end of this
# file. This file is for per-signal exceptions where a specific
# breaking change on a specific endpoint is intentional and safe.
#
# RULES for adding an entry:
#
#   - One entry = one oasdiff singleline, verbatim.
#   - Group entries by the Rust type / semantic reason, with a comment
#     naming the type and why the change is safe for consumers.
#   - Delete an entry the moment the underlying field goes away or
#     reverts. A stale allow-list hides real drift and defeats the
#     point of this check.
#   - When adding a block, assert in the PR description that no
#     consumer that worked against the pre-change spec breaks, and
#     cite the Rust type that makes that true.
#
# Produce new candidates with:
#
#   oasdiff breaking --format singleline \
#       <(git show origin/main:resources/gen/openapi.json) \
#       resources/gen/openapi.json \
#     | grep '^error ' | sed 's/^error //'
#
# ─────────────────────────────────────────────────────────────────────


# ═════════════════════════════════════════════════════════════════════
# Phase 3 — request-side DTO tightenings (new 422 on garbage input)
#
# These endpoints previously accepted ANY string on the field below and
# failed later (500 or silent nonsense). Phase 3 landed typed Rust
# enums at the DTO boundary, so garbage now gets a clean 422. No
# legitimate client that worked against the old server breaks — only
# requests that would already have failed get a clearer status code.
# Current contract pinned by `tests/api/dto_shape_regression_guards.hurl`.
# ═════════════════════════════════════════════════════════════════════

# PUT /admin/settings/storage `backend` — StorageBackendKind (local|s3|azure)
at resources/gen/openapi.json, in API PUT /api/admin/settings/storage request property `backend` was restricted to a list of enum values [request-property-became-enum].
# PUT /admin/users/{id}/role `role` — UserRoleDto (user|admin|owner)
at resources/gen/openapi.json, in API PUT /api/admin/users/{id}/role request property `role` was restricted to a list of enum values [request-property-became-enum].


# ═════════════════════════════════════════════════════════════════════
# Phase 3 — ui_preferences spec refinement (handler semantics unchanged)
#
# DTO is `Option<serde_json::Value>` — the server has always accepted
# any JSON on the wire. `#[schema(value_type = Option<Object>)]` only
# tightens the SPEC from `any` to `object | null`; the handler in
# `src/interfaces/api/handlers/profile_handler.rs` has long rejected
# non-objects with 400, so a client that sent `[1,2,3]` yesterday was
# already broken against the server (just not against the spec).
# Pinned by `tests/api/dto_shape_regression_guards.hurl`.
# ═════════════════════════════════════════════════════════════════════

at resources/gen/openapi.json, in API PATCH /api/auth/me/profile the `ui_preferences` request property `type` changed from `any` to `object, null` [request-property-type-changed].


# ═════════════════════════════════════════════════════════════════════
# §6 — `updated_at` retired from the Photos sort axis
#
# `PhotoOrderBy` (`application/dtos/photos_dto.rs`) is the Rust type that
# makes this safe: it has exactly three variants — `captured_at`,
# `created_at`, `modified_at`. The wire previously spelled the third one
# `updated_at`, which was a lie: it had always read the CONTENT clock, so
# a rename or a move never moved it. §2 repointed the column to
# `content_modified_at` and §6 renamed the wire value to match what it
# actually reports.
#
# Removing rather than aliasing was a deliberate call, recorded in §6 of
# `docs/plan/normalize-file-dates.md`: this endpoint is recent, the SPA is
# its only consumer, and §6 shipped the migration that matters — the
# persisted Photos preference is mapped `updated_at` → `modified_at` on
# READ (`routes/photos/+page.svelte`), so a user who had picked "Last
# modified" before the deploy keeps their view instead of silently
# falling back to the default. A client sending the retired value now
# gets a 400 naming the three accepted ones, which is strictly more
# informative than the silent default it used to get.
#
# DELETE THIS ENTRY once the §6/dates branch is merged to mainline. It
# only exists while `origin/main` still advertises `updated_at`; after
# the merge the base and the head agree, oasdiff emits nothing, and a
# stale entry here would hide a genuine future narrowing of this enum
# (the sibling `request-parameter-property-enum-value-removed` signal is
# the one real protection against that).
# ═════════════════════════════════════════════════════════════════════

at resources/gen/openapi.json, in API GET /api/photos/resources removed the enum value `updated_at` from the property `oneOf[#/components/schemas/PhotoOrderBy]/` of the `query` request parameter `order_by` [request-parameter-property-enum-value-removed].


# ═════════════════════════════════════════════════════════════════════
# /api/search — `order_by` and `type` became typed enums
#
# The Rust types that make these safe are `SearchOrderBy` and
# `SearchTypeFilter` (`application/dtos/search_dto.rs`). Both parameters
# were `Option<String>` in the spec; neither was free-form in practice.
#
# `order_by` — the accepted set has not changed (relevance | name | size |
# modified_at | created_at). What changed is the response to a value
# OUTSIDE it: the repository's match had a `_ =>` arm, so garbage was
# silently accepted and sorted by the default. A caller could not tell a
# honoured sort from an ignored one. Now serde refuses it with a 400 that
# names the variants. No client sending a real axis is affected.
#
# `type` — this one DOES change the accepted values, deliberately. It was
# a comma-separated list of file EXTENSIONS the SPA assembled
# (`type=mp3,wav,flac,…`) matched against the filename; it is now one
# resource category (`audio`). The old form is refused rather than
# silently matching nothing, which is the better failure: a stale client
# sending `type=mp3` gets a loud 400 instead of a confidently empty
# result page. The SPA is the only consumer and ships in lockstep.
#
# Both signals exist here and not in severity.conf on purpose:
# `request-parameter-became-enum` must keep blocking elsewhere, because
# tightening what a parameter accepts is a real wire change. Note that
# this rule only FIRES for inline-declared params — an `Option<T>` on an
# `IntoParams` struct renders as `oneOf[$ref]` and the rule cannot see
# the enum one level down, which is why the seven `/resources` listings
# tightened in §7 produced no signal at all.
#
# DELETE BOTH ENTRIES once this work merges to mainline: they only exist
# while origin/main still advertises the untyped parameters. After the
# merge base and head agree, oasdiff emits nothing, and stale entries
# here would mask a genuine future narrowing of these same two enums.
# ═════════════════════════════════════════════════════════════════════

at resources/gen/openapi.json, in API GET /api/search the `query` request parameter `order_by` was restricted to a list of enum values [request-parameter-became-enum].
at resources/gen/openapi.json, in API GET /api/search the `query` request parameter `type` was restricted to a list of enum values [request-parameter-became-enum].


# ═════════════════════════════════════════════════════════════════════
# Severity downgrades — rationale for `checks/openapi/severity.conf`
# ═════════════════════════════════════════════════════════════════════
#
# oasdiff's severity-levels file is plain `<rule-id> <level>` with no
# comment support. The rationale for each entry lives here so a single
# `grep` on this file surfaces the full gate design.
#
#   response-property-enum-value-added  → info
#       oasdiff itself suggests the fix is `x-extensible-enum`. We
#       don't emit that extension (yet), but every value our enums
#       now expose was ALREADY on the wire before Phase 3 — the Rust
#       type simply moved from `String` to a typed enum. A future
#       added value is likewise non-breaking on the wire. If we ever
#       need to NARROW a response enum, watch for the sibling rule
#       `response-property-enum-value-removed` which stays at ERR.
#
#   response-property-list-of-types-widened  → info
#       Widening the set of allowed types in a response (e.g. gaining
#       `null` on `federation_kind`, which was always nullable
#       server-side) cannot break a client that was handling the
#       response correctly.
#
# What is NOT downgraded, and why:
#
#   - `request-property-became-enum` and `request-property-type-changed`
#     stay at ERR because tightening what the server accepts is a real
#     wire-contract change (clients get 422 where they used to get 200
#     or 500). The three Phase 3 instances of these rules are allow-
#     listed per-signal in the sections above.
#   - Any rule not listed in `checks/openapi/severity.conf` keeps its
#     default severity.

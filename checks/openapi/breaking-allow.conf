# ═════════════════════════════════════════════════════════════════════
# `size_formatted` retired from the wire (16 signals)
#
# Step 5 of `docs/plan/retire-precomputed-display-fields.md`. The field
# carried a pre-rendered byte string ("3.27 MB") that the SPA mostly
# ignored: `ResourceList` — the file list, the grid, every listing row —
# has always rendered `formatBytes(size)` from the raw `size` instead.
# The single reader was `PhotoLightbox`'s caption, repointed at
# `formatBytes` in the same commit.
#
# Removing it also removes a live inconsistency, which is the real
# argument. The backend had TWO formatters feeding this one field name:
# `display_helpers::format_file_size` (listings, folders, favorites,
# recent, trash, mounts, NC REPORT) rendering "0 Bytes" / "1 KB" /
# "3.27 MB", and a private `format_bytes` in `search_service` rendering
# "0 B" / "1.0 KB" / "3.3 MB". So `/api/files` and `/api/search`
# disagreed about the same file in the same field. Both are deleted here;
# `storage_usage_service::format_bytes` stays, because it formats
# quota-exceeded error messages rather than a DTO field.
#
# The Rust doc comment claimed `format_file_size` "matches the JavaScript
# formatFileSize() output exactly". That was true of the vanilla
# frontend's helper, which went away with `static/` in 54639d46 — the
# SvelteKit `formatBytes` is a different function (1 decimal, "B" not
# "Bytes"). The comment had been a stale promise for four months.
#
# Consumer impact is a display change, not a break: `size` (u64) is
# untouched on every DTO, so any client can render its own string. The
# SPA's generated client is regenerated in the same commit. One
# user-visible difference, deliberate and noted in the plan: the photo
# lightbox caption now reads "3.3 MB" where it read "3.27 MB", which is
# what the grid behind it always showed.
#
# 16 signals, not 16 decisions: FileDto, SearchFileResultDto and
# FavoriteItemDto each lost the property, reported once per
# (path, status, schema branch). Fewer lines than the
# `icon_special_class` block above because only the File branch of the
# `ResourceContentDto` union carried a size.
#
# `response-required-property-removed` is NOT downgraded in
# severity.conf and must not be. DELETE THIS WHOLE BLOCK once this work
# merges to mainline — it only exists while `origin/main` still
# advertises the field.
# ═════════════════════════════════════════════════════════════════════


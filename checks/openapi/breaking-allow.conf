# ─────────────────────────────────────────────────────────────────────
# oasdiff — allow-list for API breaking changes vs. the PR base branch
# ─────────────────────────────────────────────────────────────────────
# This file is read by `oasdiff breaking --err-ignore` in the
# `openapi-breaking-check` CI job (.github/workflows/ci.yml) and the
# local mirror `just check-openapi`. Each non-blank, non-comment line
# is an EXACT MATCH against one line of oasdiff's `--format singleline`
# output (the leading `error ` prefix is optional; everything after it
# must match verbatim). oasdiff supports no substring or regex form.
#
# WHOLE-RULE DOWNGRADES live in `checks/openapi/severity.conf`, not
# here. That file is a plain `<rule-id> <level>` table — oasdiff does
# not support comments in it, so the rationale for each downgrade is
# recorded in the "Severity downgrades" section at the end of this
# file. This file is for per-signal exceptions where a specific
# breaking change on a specific endpoint is intentional and safe.
#
# RULES for adding an entry:
#
#   - One entry = one oasdiff singleline, verbatim.
#   - Group entries by the Rust type / semantic reason, with a comment
#     naming the type and why the change is safe for consumers.
#   - Delete an entry the moment the underlying field goes away or
#     reverts. A stale allow-list hides real drift and defeats the
#     point of this check.
#   - When adding a block, assert in the PR description that no
#     consumer that worked against the pre-change spec breaks, and
#     cite the Rust type that makes that true.
#
# Produce new candidates with:
#
#   oasdiff breaking --format singleline \
#       <(git show origin/main:resources/gen/openapi.json) \
#       resources/gen/openapi.json \
#     | grep '^error ' | sed 's/^error //'
#
# ─────────────────────────────────────────────────────────────────────


# ═════════════════════════════════════════════════════════════════════
# `is_root` retired from the wire (13 signals)
#
# Audited the same way as the three display fields above, and it failed
# the same test: zero readers. Nothing in `frontend/src` consumed it
# (`FolderBreadcrumb`'s `isRootTheLeaf` is a local derived off
# `visibleCrumbs.length`, unrelated to the field), no Hurl or e2e test
# asserted it, and the only Rust read was one unit assert in
# `folder_handler`'s mount tests.
#
# It is also fully derivable from a field on the SAME object:
# `FolderDto::from` computed it as `parts.parent_id.is_none()`, and
# `parent_id` stays on the wire. A client wanting it writes
# `parent_id === null`.
#
# The stronger argument is that it was not merely redundant but
# UNRELIABLE. Only `FolderDto::from` derived it; four production sites
# hardcoded `is_root: false` while taking `parent_id` from a nullable
# column — `path_resolver_service`, `trash_service`, `recent_handler`,
# `favorites_handler`. `path_resolver_service` is the clearest: its query
# is `WHERE fo.path = $1` over `storage.folders` with no parent filter,
# so resolving a drive root's path returned `parent_id: None` alongside
# `is_root: false`. The field could contradict the field it summarised.
# Removing it deletes that class of bug instead of fixing it four times
# for a field nobody read.
#
# This one is NOT a presentational string, so it sits outside what
# `retire-precomputed-display-fields.md` originally scoped; it is
# recorded in that plan's "Adjacent removal" section rather than as a
# seventh step.
#
# `response-required-property-removed` is NOT downgraded in
# severity.conf and must not be. DELETE THIS WHOLE BLOCK once this work
# merges to mainline.
# ═════════════════════════════════════════════════════════════════════


# ═════════════════════════════════════════════════════════════════════
# Severity downgrades — rationale for `checks/openapi/severity.conf`
# ═════════════════════════════════════════════════════════════════════
#
# oasdiff's severity-levels file is plain `<rule-id> <level>` with no
# comment support. The rationale for each entry lives here so a single
# `grep` on this file surfaces the full gate design.
#
#   response-property-enum-value-added  → info
#       oasdiff itself suggests the fix is `x-extensible-enum`. We
#       don't emit that extension (yet), but every value our enums
#       now expose was ALREADY on the wire before Phase 3 — the Rust
#       type simply moved from `String` to a typed enum. A future
#       added value is likewise non-breaking on the wire. If we ever
#       need to NARROW a response enum, watch for the sibling rule
#       `response-property-enum-value-removed` which stays at ERR.
#
#   response-property-list-of-types-widened  → info
#       Widening the set of allowed types in a response (e.g. gaining
#       `null` on `federation_kind`, which was always nullable
#       server-side) cannot break a client that was handling the
#       response correctly.
#
# What is NOT downgraded, and why:
#
#   - `request-property-became-enum` and `request-property-type-changed`
#     stay at ERR because tightening what the server accepts is a real
#     wire-contract change (clients get 422 where they used to get 200
#     or 500). The three Phase 3 instances of these rules are allow-
#     listed per-signal in the sections above.
#   - Any rule not listed in `checks/openapi/severity.conf` keeps its
#     default severity.

# ── ResourceCategory (retire-precomputed-display-fields.md) ───────────
#
# `SearchTypeFilter::Other` is renamed to `Unknown` so the coarse filter
# and the new `ResourceCategory::Unknown` name one bucket one way. It is
# a REQUEST parameter narrowing, which this file otherwise keeps at ERR
# — allow-listed per-signal, not by downgrading the rule.
#
# Safe because `type=other` has never been in a release: it landed on the
# unmerged search-type branch and merged to main inside this same
# development cycle, so no client can have adopted it. DELETE this entry
# once main has been released past it — unlike the rule downgrades above,
# this is a one-off and must not outlive its reason.
at resources/gen/openapi.json, in API GET /api/search removed the enum value `other` from the `query` request parameter `type` [request-parameter-enum-value-removed].

# ── FolderAncestorDto id/parent_id — Uuid → String (#837) ─────────────
#
# `FolderAncestorDto.id` and `FolderAncestorDto.parent_id` lost their
# `format: uuid` annotation because the field type widened from `Uuid`
# to `String`. The widening was mandatory for #837: `GET /api/folders/
# {id}/ancestors` on a folder inside an external mount returns `ext:
# <mount>:<token>` ids in the chain, which cannot be `Uuid`. The native-
# folder case still produces a canonical hyphenated-UUID string on the
# wire — the format drop is a schema loosening, not a value-shape
# change on existing callers.
#
# Safe because: no code reads the field as a Uuid. Backend reads: 0
# (the DTO is response-only, never deserialized). Frontend reads: 3
# call sites in `FolderBreadcrumb.svelte` + 1 in `ShareDialog.svelte`,
# all treating `.id` / `.parent_id` as plain strings — the generated
# TS has typed it as `string` all along (OpenAPI `format: uuid` renders
# as plain `string` in the TS generator). Same shape every other mount-
# aware id field (`FolderDto::id`, `ResourceDto::id`) already uses.
#
# This block must NEVER migrate `response-property-type-changed` into
# `severity.conf` — the signal is correct for every OTHER DTO on the
# wire; the exception is per-signal here because the type widening is
# intentional only for this specific field.
#
# DELETE THIS BLOCK once the next release ships past the FolderAncestorDto
# rename.
at resources/gen/openapi.json, in API GET /api/folders/{id}/ancestors the `ancestors/items/id` response's property `format` changed from `uuid` to `none` for status `200` [response-property-type-changed].

# ─────────────────────────────────────────────────────────────────────
# Reaped 2026-10-22 — six entries deleted because they had merged
#
# Each of these existed only while `origin/main` lacked the change it
# covered; once merged, base and head agree and oasdiff emits nothing for
# them. Verified empirically rather than by reading the merge log — the
# raw signal set was diffed against this file, and these six matched
# nothing:
#
#   - PUT /admin/settings/storage `backend` became an enum      (Phase 3)
#   - PUT /admin/users/{id}/role `role` became an enum          (Phase 3)
#   - PATCH /auth/me/profile `ui_preferences` any → object|null (Phase 3)
#   - GET /photos/resources `PhotoOrderBy` lost `updated_at`    (dates §6)
#   - GET /search `order_by` became an enum                     (search-type)
#   - GET /search `type` became an enum                         (search-type)
#
# The three Phase-3 entries had been dead for considerably longer than
# the other three — they were already stale before this branch existed.
# That is the failure mode the header warns about: a stale entry silently
# pre-authorises a future break on the same endpoint, so the next person
# to narrow `backend`, `role` or `ui_preferences` would get a green gate.
# Worth a habit: when a branch merges, re-diff this file rather than
# trusting its own delete-on-merge notes to be acted on.
#
# The rationale text for each is not reproduced — it is in the git
# history of this file, attached to the entry it justified.
# ─────────────────────────────────────────────────────────────────────


# ═════════════════════════════════════════════════════════════════════
# `icon_special_class` retired from the wire (30 signals)
#
# Step 2 of `docs/plan/retire-precomputed-display-fields.md`. The field
# carried a CSS class name — "pdf-icon", "code-icon js-icon" — for the
# stylesheet that styled the icon container. That stylesheet
# (`static/css/style.css`) was DELETED with the legacy vanilla frontend
# in commit 54639d46 on 2026-06-21. The server kept computing the
# classes and serialising them on every listing row for four months; no
# rule in the repo could see that the thing they named was gone.
#
# What makes removal safe is not a Rust type here but the absence of
# one: the audit in that plan found ZERO readers. The only non-test
# reference in `frontend/src` was `lib/utils/media.ts`, which SET it to
# `''` while synthesising a `FileItem` from a photo DTO — a producer
# filling a required field, not a consumer. Nothing in the SPA or in
# `static/` read it, and no CSS defines the classes it emitted. The
# SPA's generated client is regenerated in the same commit.
#
# The 30 entries are 6 DTOs × their endpoints, not 30 decisions:
# FileDto, FolderDto, SearchFileResultDto / SearchSuggestionItem,
# TrashedItemDto, RecentItemDto and FavoriteItemDto each lost the
# property, and oasdiff reports once per (path, status, schema branch) —
# hence two lines per `/resources` listing, where the `ResourceContentDto`
# union surfaces File and Folder as separate `oneOf` branches.
#
# `response-required-property-removed` is NOT downgraded in
# severity.conf and must not be: dropping a required response property
# is normally a real break. These signals are enumerated one by one so
# that any OTHER property disappearing from any of these same endpoints
# still fails the gate.
#
# DELETE THIS WHOLE BLOCK once this work merges to mainline — it only
# exists while `origin/main` still advertises the field. After the merge
# base and head agree, oasdiff emits nothing here, and a stale block
# would mask a genuine future removal from these endpoints.
# ═════════════════════════════════════════════════════════════════════


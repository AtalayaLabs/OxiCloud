# ═════════════════════════════════════════════════════════════════════
# `icon_class` retired from the wire (30 signals)
#
# Steps 3 and 4 of `docs/plan/retire-precomputed-display-fields.md`, in
# that order: the SPA learned to derive the glyph first, THEN the field
# was removed. Reversing them would have blanked every icon in the UI,
# which is why this is the only one of the three removals with a
# prerequisite.
#
# The field was a round-trip the client immediately undid. The server
# sent `"fas fa-file-pdf"`; both consumers passed it straight into
# `utils/display.ts::iconNameFromClass`, which parsed the Font Awesome
# token back out to look `"file-pdf"` up in the SPA's icon registry. So
# the API serialised a CSS class string that was never used as a CSS
# class — a format conversion with no reader on either side of it.
#
# `iconNameFor(name, mime)` (`frontend/src/lib/utils/display.ts`) now
# does the classification client-side. It is a port of the deleted
# `display_helpers.rs::icon_class_with_ext`, same resolution order
# (specific MIME → MIME prefix → extension), resolving straight to a
# registry key. The deleted Rust test's corpus moved with it into
# `display.test.ts`, which additionally asserts that every glyph the
# classifier can name exists in the registry — a check the Rust side did
# not need, because there a typo produced a dead CSS class rather than a
# blank cell.
#
# `GET /api/search/suggest` is the one endpoint that changed shape
# rather than shrinking: `SearchSuggestionItem` had no `mime_type`, so
# dropping `icon_class` would have left suggestions classifiable by
# filename alone. The field was swapped for `mime_type` (folders carry
# `"directory"`). Adding a response property is not breaking, so only
# the removal appears below.
#
# Consumer impact: a stale client degrades rather than errors — the old
# `iconNameFromClass` returned `'file'` for missing input, so a cached
# build shows generic glyphs instead of failing. Nothing else on the
# wire moved; `mime_type` and `name` were already on every DTO, which is
# why this needed no new field anywhere except suggest.
#
# `response-required-property-removed` is NOT downgraded in
# severity.conf and must not be. DELETE THIS WHOLE BLOCK once this work
# merges to mainline — it only exists while `origin/main` still
# advertises the field.
# ═════════════════════════════════════════════════════════════════════


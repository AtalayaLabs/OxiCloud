name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      # The two committed API specs the docs site embeds via
      # Scalar (OpenAPI) and the AsyncAPI HTML template. When a
      # backend PR regenerates them via `just openapi` / `just
      # asyncapi`, the deployed reference should refresh too.
      - 'resources/gen/openapi.json'
      - 'resources/gen/asyncapi.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: docs
        run: npm install

      - name: Build docs
        working-directory: docs
        run: npm run docs:build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
